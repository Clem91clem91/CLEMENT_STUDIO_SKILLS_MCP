[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clement-studio-skills-mcp"
version = "0.1.0"
description = "CLEMENT STUDIO P0-02 deterministic READ-ONLY Skills MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
clement-skills-mcp = "clement_skills_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
